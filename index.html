<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ojek Express</title><link rel="stylesheet" href="style.css"></head><body data-page="index"><main>
<h1>Ojek Express</h1><p>Antar jemput penumpang dan barang.</p>
<div class="card"><div class="seg" id="roleSeg"><button data-v="pelanggan" class="on">Pelanggan</button><button data-v="driver">Driver</button></div>
<div class="seg" id="modeSeg"><button data-v="login" class="on">Masuk</button><button data-v="daftar">Daftar</button></div>
<form id="f"><input name="nama" class="reg" placeholder="Nama lengkap"><input name="wa" placeholder="No. WhatsApp" inputmode="tel" required>
<input name="kendaraan" class="drv" placeholder="Jenis kendaraan"><input name="plat" class="drv" placeholder="Plat nomor">
<input name="pw" type="password" placeholder="Password (min. 6 karakter)" minlength="6" required><button class="btn" id="go">Masuk</button></form></div>
</main><script src="app.js"></script></body></html>
